version: "3.8"

services:
  frontend:
    image: money-app-web:latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8085:80"
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend

  backend:
    image: money-app:latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Recomendación: NO publicar el puerto del backend hacia el host si solo lo consume el frontend.
    # Si necesitas acceder al backend desde afuera para pruebas, descomenta ports.
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      # Un único salto Nginx
      - TRUST_PROXY=1
